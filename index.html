<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Karting Logbook — бортовой журнал картингиста в Telegram" />
  <title>Karting Logbook</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ======== Экран загрузки ======== -->
  <div id="splash" class="splash">
    <div class="splash__icon">🏎️</div>
    <div class="splash__title">Karting Logbook</div>
    <div class="splash__sub">Загрузка…</div>
  </div>

  <!-- ======== Основное приложение (скрыто до инициализации) ======== -->
  <div id="app" class="app hidden">

    <!-- ——— Вкладка 1: Новый заезд ——— -->
    <section id="tab-race" class="tab-content active">
      <h1 class="page-title">Новый заезд</h1>

      <form id="race-form" autocomplete="off">
        <!-- Название выезда -->
        <div class="field">
          <label for="input-session-name">Название выезда</label>
          <input id="input-session-name" type="text" required />
        </div>

        <!-- Лучшее время -->
        <div class="field">
          <label for="input-laptime">Лучшее время</label>
          <input id="input-laptime" type="text" placeholder="0:00.000" required />
        </div>

        <!-- Разделитель: Сетап -->
        <div class="section-divider">Настройка (Сетап)</div>

        <!-- Секция 1: Давление -->
        <details class="setup-section" open>
          <summary class="setup-section__header">Давление колес (Бар)</summary>
          <div class="setup-section__content">
            <div class="tire-grid">
              <!-- FL -->
              <div class="tire-card">
                <div class="tire-card__title">Переднее левое</div>
                <div class="tire-card__inputs">
                  <input type="number" id="input-fl-cold" step="0.01" placeholder="Холод" />
                  <input type="number" id="input-fl-hot" step="0.01" placeholder="Горяч" />
                </div>
              </div>
              <!-- FR -->
              <div class="tire-card">
                <div class="tire-card__title">Переднее правое</div>
                <div class="tire-card__inputs">
                  <input type="number" id="input-fr-cold" step="0.01" placeholder="Холод" />
                  <input type="number" id="input-fr-hot" step="0.01" placeholder="Горяч" />
                </div>
              </div>
              <!-- RL -->
              <div class="tire-card">
                <div class="tire-card__title">Заднее левое</div>
                <div class="tire-card__inputs">
                  <input type="number" id="input-rl-cold" step="0.01" placeholder="Холод" />
                  <input type="number" id="input-rl-hot" step="0.01" placeholder="Горяч" />
                </div>
              </div>
              <!-- RR -->
              <div class="tire-card">
                <div class="tire-card__title">Заднее правое</div>
                <div class="tire-card__inputs">
                  <input type="number" id="input-rr-cold" step="0.01" placeholder="Холод" />
                  <input type="number" id="input-rr-hot" step="0.01" placeholder="Горяч" />
                </div>
              </div>
            </div>
          </div>
        </details>

        <!-- Секция 2: Перед -->
        <details class="setup-section">
          <summary class="setup-section__header">Передняя ось</summary>
          <div class="setup-section__content">
            <div class="field">
              <label for="input-f-track">Ширина колеи (проставки)</label>
              <input id="input-f-track" type="text" placeholder="например: 2 большие, 1 малая" />
            </div>
            <div class="field">
              <label for="input-caster">Кастор</label>
              <input id="input-caster" type="text" placeholder="например: Нейтральный или +1 деление" />
            </div>
            <div class="field">
              <label for="input-camber">Развал</label>
              <input id="input-camber" type="text" placeholder="например: -2 деления" />
            </div>
            <div class="field">
              <label for="input-toe">Схождение (Toe)</label>
              <input id="input-toe" type="text" placeholder="например: +1 мм (in/out)" />
            </div>
            <div class="field">
              <label for="select-ackermann">Аккерман</label>
              <select id="select-ackermann">
                <option value="Стандарт" selected>Стандарт</option>
                <option value="Меньше">Меньше</option>
                <option value="Больше">Больше</option>
              </select>
            </div>
            <div class="field">
              <label for="select-f-rideheight">Клиренс</label>
              <select id="select-f-rideheight">
                <option value="Низкий">Низкий (шайбы внизу)</option>
                <option value="Средний" selected>Средний (стандарт)</option>
                <option value="Высокий">Высокий (шайбы вверху)</option>
              </select>
            </div>
            <div class="field">
              <label for="select-f-torsion">Передний торсион</label>
              <select id="select-f-torsion">
                <option value="Снят" selected>Снят</option>
                <option value="Мягкий">Мягкий</option>
                <option value="Плоский">Плоский</option>
                <option value="Жесткий">Жесткий</option>
              </select>
            </div>
            <div class="field">
              <label for="input-f-hubs">Передние ступицы</label>
              <input id="input-f-hubs" type="text" placeholder="например: магний 90мм" />
            </div>
            <div class="field">
              <label for="select-floorpan">Затяжка полика</label>
              <select id="select-floorpan">
                <option value="Затянута" selected>Затянута</option>
                <option value="Расслаблена">Расслаблена</option>
              </select>
            </div>
          </div>
        </details>

        <!-- Секция 3: Зад -->
        <details class="setup-section">
          <summary class="setup-section__header">Задняя ось</summary>
          <div class="setup-section__content">
            <div class="field">
              <label for="input-r-track">Ширина колеи (мм)</label>
              <input id="input-r-track" type="text" placeholder="например: 1400 мм" />
            </div>
            <div class="field">
              <label for="select-r-axle">Жесткость оси</label>
              <select id="select-r-axle">
                <option value="Soft (S)">Soft (S)</option>
                <option value="Medium (M)" selected>Medium (M)</option>
                <option value="Hard (H)">Hard (H)</option>
              </select>
            </div>
            <div class="field">
              <label for="select-r-rideheight">Клиренс</label>
              <select id="select-r-rideheight">
                <option value="Низкий">Низкий (кассеты высоко)</option>
                <option value="Средний" selected>Средний (стандарт)</option>
                <option value="Высокий">Высокий (кассеты низко)</option>
              </select>
            </div>
            <div class="field">
              <label for="input-r-hubs">Задние ступицы</label>
              <input id="input-r-hubs" type="text" placeholder="например: магний 95мм" />
            </div>
            <div class="field">
              <label for="input-seat-stays">Тяги сиденья (кол-во)</label>
              <input id="input-seat-stays" type="number" min="0" max="6" step="1" value="2" />
            </div>
            <div class="field">
              <label for="input-seat-pos">Позиция сиденья</label>
              <input id="input-seat-pos" type="text" placeholder="сдвиг, высота" />
            </div>
            <div class="field">
              <label for="select-third-bearing">Третий подшипник</label>
              <select id="select-third-bearing">
                <option value="Затянут" selected>Затянут</option>
                <option value="Расслаблен">Расслаблен</option>
              </select>
            </div>
            <div class="field">
              <label for="select-bumper">Затяжка отбойника</label>
              <select id="select-bumper">
                <option value="С люфтом" selected>С люфтом</option>
                <option value="Затянута жестко">Затянута жестко</option>
              </select>
            </div>
            <div class="field">
              <label for="select-r-torsion">Задний торсион</label>
              <select id="select-r-torsion">
                <option value="Снят" selected>Снят</option>
                <option value="Мягкий">Мягкий</option>
                <option value="Жесткий">Жесткий</option>
              </select>
            </div>
          </div>
        </details>

        <!-- Заметки -->
        <div class="field">
          <label for="input-notes">Заметки</label>
          <textarea id="input-notes" rows="3" placeholder="Погода, покрытие, ощущения…"></textarea>
        </div>

        <button type="submit" class="btn-primary" id="btn-save">💾 Сохранить заезд</button>
      </form>
    </section>

    <!-- ——— Вкладка 2: История ——— -->
    <section id="tab-history" class="tab-content">
      <h1 class="page-title">История заездов</h1>
      <div id="history-list" class="history-list">
        <p class="empty-state">Пока нет записей</p>
      </div>
    </section>

    <!-- ——— Вкладка 3: Сетапы ——— -->
    <section id="tab-setups" class="tab-content">
      <h1 class="page-title">Сохранённые сетапы</h1>
      <div id="setups-list" class="setups-list">
        <p class="empty-state">Сетапы появятся после сохранения заездов</p>
      </div>
    </section>

    <!-- ——— Нижняя навигация ——— -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-btn active" data-tab="tab-race">
        <span class="nav-btn__icon">🏁</span>
        <span class="nav-btn__label">Заезд</span>
      </button>
      <button class="nav-btn" data-tab="tab-history">
        <span class="nav-btn__icon">📋</span>
        <span class="nav-btn__label">История</span>
      </button>
      <button class="nav-btn" data-tab="tab-setups">
        <span class="nav-btn__icon">⚙️</span>
        <span class="nav-btn__label">Сетапы</span>
      </button>
    </nav>
  </div>

  <!-- Toast-уведомление -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
